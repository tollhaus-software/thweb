# ==============================================================================
# Tollhaus Web Portal (thweb) - Role & Permission Definitions
# ==============================================================================
# Roles are synchronized to the PostgreSQL 'roles' table upon backend startup.
# The 'auto_grant_on' field declares conditions under which a role is dynamically
# or automatically granted. Supported triggers:
#   - mock_auth: Seeded for developer@example.com when ALLOW_MOCK_AUTH=true
#   - kiosk_cert: Granted to requests authenticated via mTLS client certificates
#   - parent_identifier_email: Granted to parents logging in via verified contact emails
#   - caregiver_identifier_email: Granted to caregivers logging in via verified contact emails
#   - cook_identifier_email: Granted to cooks logging in via verified contact emails
#   - bufdi_identifier_email: Granted to bufdis logging in via verified contact emails
# ==============================================================================

roles:
  - id: admin
    name: Administrator
    description: Full system access
    auto_grant_on:
      - mock_auth
    permissions:
      - "*"

  - id: viewer
    name: Viewer
    description: Read-only access
    permissions:
      - families.all.read
      - fees.self.read
      - audit.view

  - id: kiosk
    name: Kiosk
    description: Read-only dashboard access for mTLS hardware kiosk terminals
    auto_grant_on:
      - kiosk_cert
    permissions:
      - dashboard.read

  - id: parent_default
    name: Parent (default)
    description: Scoped self-service access for parents matching verified identifier emails
    auto_grant_on:
      - parent_identifier_email
    permissions:
      - families.all.restrictedread
      - fees.self.read
      - families.self.selfservice
      - memberships.self.read
      - meal_allergens.read
      - meal_allergens.write

  - id: caregiver_default
    name: Caregiver (default)
    description: Default access for caregivers logging in via identifier email
    auto_grant_on:
      - caregiver_identifier_email
    permissions:
      - families.all.restrictedread
      - mealplan.view
      - meal_allergens.read
      - meal_allergens.write

  - id: cook_default
    name: Cook (default)
    description: Default access for cooks logging in via identifier email
    auto_grant_on:
      - cook_identifier_email
    permissions:
      - mealplan.view
      - meal_allergens.read
      - meal_allergens.write

