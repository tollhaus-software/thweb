include:
  - docker-compose.common.yml

services:
  db:
    container_name: thweb-db
    ports: # Exposed in local testing config for convenience
      - "5432:5432"

  backend:
    container_name: thweb-backend
    ports: # Exposed in local testing config for convenience
      - "8080:8080"

  frontend:
    container_name: thweb-frontend

  oauth2-proxy:
    container_name: thweb-oauth2-proxy
    ports:
      - "80:4180"
